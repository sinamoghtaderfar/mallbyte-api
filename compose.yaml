services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_UID: 1000
        APP_GID: 1000
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mallbyte_backend

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mallbyte_db
      POSTGRES_USER: mallbyte_user
      POSTGRES_PASSWORD: mallbyte_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mallbyte_user -d mallbyte_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mallbyte_backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mallbyte_backend

volumes:
  postgres_data:

networks:
  mallbyte_backend:
    driver: bridge
