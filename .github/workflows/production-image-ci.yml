name: Production image smoke check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  production-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build runtime image without development dependencies
        run: docker build -f Dockerfile.production -t mallbyte-api-production:test .
      - name: Validate Django production configuration
        run: |
          docker run --rm \
            -e DJANGO_SETTINGS_MODULE=config.settings.production \
            -e SECRET_KEY=ci-only-placeholder-do-not-deploy \
            -e MFA_FERNET_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            -e ALLOWED_HOSTS=example.com \
            -e REDIS_URL=redis://localhost:6379/0 \
            -e CACHE_BACKEND=redis \
            -e CACHE_REDIS_URL=redis://localhost:6379/1 \
            mallbyte-api-production:test python manage.py check --deploy

      - name: Assert critical Production cookie and database TLS settings
        run: |
          docker run --rm \
            -e DJANGO_SETTINGS_MODULE=config.settings.production \
            -e SECRET_KEY=ci-only-placeholder-do-not-deploy \
            -e MFA_FERNET_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            -e ALLOWED_HOSTS=example.com \
            -e REDIS_URL=redis://localhost:6379/0 \
            -e CACHE_BACKEND=redis \
            -e CACHE_REDIS_URL=redis://localhost:6379/1 \
            mallbyte-api-production:test python -c 'from django.conf import settings; assert settings.AUTH_COOKIE_SECURE; assert settings.SESSION_COOKIE_SECURE; assert settings.CSRF_COOKIE_SECURE; assert settings.DATABASES["default"]["OPTIONS"]["sslmode"] == "require"; assert settings.SECURE_SSL_REDIRECT'
