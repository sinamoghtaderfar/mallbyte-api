name: Static quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install ruff==0.15.5
      - name: Lint remediated observability and configuration
        run: ruff check apps/observability config
      - name: Parse backend Python sources
        run: python -m compileall -q apps config deploy ops
