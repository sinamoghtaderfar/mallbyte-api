name: Dependency security

on:
  pull_request:
    paths:
      - requirements/**
      - .github/workflows/dependency-security.yml
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install isolated security tooling and runtime requirements
        run: python -m pip install -r requirements/security.txt
      - name: Check runtime dependency compatibility
        run: python -m pip check
      - name: Audit declared runtime dependencies
        run: python -m pip_audit --strict --progress-spinner off -r requirements/production.txt
