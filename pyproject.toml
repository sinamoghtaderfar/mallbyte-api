[tool.ruff]
line-length = 320
target-version = "py312"
exclude = [
    "apps/**/migrations",
]
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
[tool.ruff.lint.per-file-ignores]
"config/settings/production.py" = ["F403", "F405"]
