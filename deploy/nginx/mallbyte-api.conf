# Internal-only gateway behind a trusted HTTPS reverse proxy.
# The outer proxy MUST overwrite X-Forwarded-Proto with "https",
# overwrite X-Mallbyte-Client-IP with the connection's client IP, and forward
# Host. Do not expose this gateway publicly.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    autoindex off;
    client_max_body_size 15m;

    location = /gateway-healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location ^~ /private_media/ {
        return 404;
    }

    location ^~ /static/ {
        alias /srv/mallbyte/static/;
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
        expires 1h;
    }

    location ^~ /media/ {
        alias /srv/mallbyte/media/;
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        expires 10m;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        # Sanitized by the ONLY permitted upstream TLS terminator.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Only the trusted outer proxy may reach this gateway. It MUST overwrite
        # this dedicated header; ordinary incoming X-Forwarded-For is discarded.
        proxy_set_header X-Forwarded-For $http_x_mallbyte_client_ip;
        proxy_set_header X-Real-IP $http_x_mallbyte_client_ip;
        proxy_set_header Connection "";
        proxy_read_timeout 65s;
    }
}
