# Internal-only gateway behind a trusted HTTPS reverse proxy.
# The outer proxy MUST overwrite X-Forwarded-Proto with "https",
# and should forward Host. Do not expose this gateway publicly.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    autoindex off;
    client_max_body_size 15m;

    location = /gateway-healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location ^~ /private_media/ {
        return 404;
    }

    location ^~ /static/ {
        alias /srv/mallbyte/static/;
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
        expires 1h;
    }

    # Legacy sensitive media stays blocked while files are migrated privately.
    location ^~ /media/analytics/ { return 404; }
    location ^~ /media/returns/ { return 404; }
    location ^~ /media/support/attachments/ { return 404; }

    location ^~ /media/ {
        alias /srv/mallbyte/media/;
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        expires 10m;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        # Sanitized by the ONLY permitted upstream TLS terminator.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Never pass client-provided X-Forwarded-For blindly.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 65s;
    }
}
